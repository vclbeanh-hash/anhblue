name: Build LEM Yuno dylib
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 for iOS 16
        run: |
          mkdir -p dist
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 -isysroot "$SDK" -fobjc-arc -fblocks -Os -dynamiclib LEMYuno.m -framework Foundation -framework UIKit -framework QuartzCore -Wl,-install_name,@rpath/LEM-Yuno.dylib -o dist/LEM-Yuno.dylib
          codesign --force --sign - dist/LEM-Yuno.dylib
          file dist/LEM-Yuno.dylib
          xcrun vtool -show-build dist/LEM-Yuno.dylib
          codesign --verify --verbose dist/LEM-Yuno.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: LEM-Yuno-arm64
          path: dist/LEM-Yuno.dylib
          if-no-files-found: error
